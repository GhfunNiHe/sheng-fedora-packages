name: Build Sheng RPM Packages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.spec'
      - '**/Makefile'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '.github/workflows/build-sheng-rpms.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build RPMs
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:latest
    env:
      # Every compile goes through ccache: meson does not detect ccache by
      # itself (mesonbuild/envconfig.py never calls detect_compiler_cache()
      # any more), it honours CC/CXX from the environment, so these two lines
      # are what put libssc and iio-sensor-proxy-ssc into the cache.
      # sheng-devauth's Makefile compiles with $(CC) and sets no CC of its own
      # (so an env CC beats make's built-in default), xiaomi-sheng-thp's uses
      # $(CXX) behind a `CXX ?= g++`. The kernel spec is not affected: every
      # make call in it passes CC="ccache clang" on the command line, and a
      # command-line assignment wins over the environment.
      #
      # The two packages that used to punch holes in this: the keyboard helper
      # passed CC=gcc on the %make_build line (deleted) and the fingerprint
      # spec exported CCACHE_DISABLE=1 plus a bare `gcc` call (both fixed).
      CC: ccache gcc
      CXX: ccache g++
      # kernel-sm8550.spec would default to 10G, which is GitHub's entire
      # per-repository cache budget: one kernel cache would evict everything.
      CCACHE_MAXSIZE: 4G
      # Same two settings the kernel spec already exports, hoisted to the job
      # so the meson/make packages benefit as well: __FILE__ and the CWD only
      # differ per version directory, which would otherwise cost a hit.
      CCACHE_SLOPPINESS: file_macro,locale,time_macros
      CCACHE_NOHASHDIR: 'true'

    steps:
      - name: Install build tools
        run: |
          # ccache is installed up front rather than left to the kernel spec's
          # BuildRequires, which only pulls it in for the last phase: the
          # meson and plain-make packages compile long before that and need the
          # binary on PATH for the CC="ccache gcc" above to resolve.
          dnf install -y rpmdevtools dnf-plugins-core createrepo_c rpm-sign systemd-rpm-macros ccache

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rpmbuild dirs
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          # One ccache directory for every compile in the job: the kernel spec
          # uses ${CCACHE_DIR:-$HOME/.ccache} and meson's packages use ccache's
          # own default (~/.cache/ccache) unless this is pinned, which would
          # leave them writing to a directory nothing caches.
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ================================================================
      # ccache: one pool for every C/C++ compile in this repo — the kernel
      # here and in the standalone kernel workflow share the key prefix.
      #
      # Restore and save are separate steps on purpose. The combined
      # actions/cache action hides the save in its post step, which is
      # declared `post-if: success()`, and its `save-always` input is
      # deprecated because it "does not work as intended" — so a failed run
      # silently throws away everything it compiled, and a kernel failure
      # worth retrying (a link that dies, a DTB assertion) always happens
      # after the expensive compiles. `if: always()` on the save step at the
      # end of the job is the documented replacement.
      #
      # The primary key carries github.run_id because a cache entry can never
      # be overwritten: with a stable key the first successful run would pin
      # the entry for good and every later run would only ever read that stale
      # copy. The restore keys then pick up the newest entry of any run.
      # ================================================================
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-sheng-sm8550-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-sheng-sm8550-${{ runner.os }}-${{ runner.arch }}-
            ccache-sheng-sm8550-

      # ================================================================
      # Download all sources
      # ================================================================
      - name: Download all sources
        run: |
          dnf install -y spectool dnf-plugins-core
          for spec in $(find . -name "*.spec" -not -path '*/.git/*'); do
            if grep -q "^Source0:" "$spec" 2>/dev/null; then
              echo "Downloading sources for $spec..."
              spectool -g -R "$spec"
            fi
          done
          # Create tarballs for specs with local files (no external Source0)
          for dir in alsa-xiaomi-sheng sheng-sensors sheng-fedora-configs; do
            name=$(rpmspec -q --queryformat "%{NAME}-%{VERSION}" "$dir/$dir.spec")
            tmpdir=$(mktemp -d)
            cp -r "$dir"/usr "$dir"/etc "$tmpdir/" 2>/dev/null || true
            mv "$tmpdir" "$name"
            tar -czf ~/rpmbuild/SOURCES/$name.tar.gz "$name"
            rm -rf "$name"
          done
          # Download libfprint source for fingerprint build
          dnf download --source libfprint --destdir ~/rpmbuild/SOURCES/ 2>/dev/null || true
          for src in ~/rpmbuild/SOURCES/libfprint-*.src.rpm; do
            [ -f "$src" ] && rpm2cpio "$src" | cpio -idm -D ~/rpmbuild/SOURCES/ "*tar*" 2>/dev/null
          done
          # Fallback: download directly from gitlab if dnf source failed
          if [ ! -f ~/rpmbuild/SOURCES/libfprint-src.tar.xz ]; then
            curl -fL -o ~/rpmbuild/SOURCES/libfprint-src.tar.xz \
              'https://gitlab.freedesktop.org/libfprint/libfprint/-/archive/v1.94.10/libfprint-v1.94.10.tar.gz'
          fi

      # ================================================================
      # Phase 1: Noarch packages
      # ================================================================
      - name: "Build: xiaomi-sheng-firmware"
        run: rpmbuild -ba --nodebuginfo ./xiaomi-sheng-firmware/xiaomi-sheng-firmware.spec && createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: alsa-xiaomi-sheng"
        run: rpmbuild -ba --nodebuginfo ./alsa-xiaomi-sheng/alsa-xiaomi-sheng.spec && createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: xiaomi-mipps-auth"
        run: rpmbuild -ba --nodebuginfo ./xiaomi-mipps-auth/xiaomi-mipps-auth.spec && createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: xiaomi-charger-mode"
        run: rpmbuild -ba --nodebuginfo ./xiaomi-charger-mode/xiaomi-charger-mode.spec && createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: sheng-sensors"
        run: |
          cp ./sheng-sensors/adsprpcd-sensorspd.service ~/rpmbuild/SOURCES/
          rpmbuild -ba --nodebuginfo ./sheng-sensors/sheng-sensors.spec && createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: sheng-fedora-configs"
        run: rpmbuild -ba --nodebuginfo ./sheng-fedora-configs/sheng-fedora-configs.spec && createrepo_c --update ~/rpmbuild/RPMS

      # ================================================================
      # Phase 2: libssc
      # ================================================================
      - name: "Build: libssc"
        run: |
          cp libssc/wait_for_qmi_service.patch ~/rpmbuild/SOURCES/
          dnf builddep -y ./libssc/libssc.spec
          rpmbuild -ba --nodebuginfo ./libssc/libssc.spec
          createrepo_c --update ~/rpmbuild/RPMS

      # ================================================================
      # Phase 3: Packages depending on libssc
      # ================================================================
      - name: "Build: iio-sensor-proxy-ssc"
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/libssc-*.rpm
          cp iio-sensor-proxy-ssc/49-iio-sensor-proxy.rules ~/rpmbuild/SOURCES/
          dnf builddep -y ./iio-sensor-proxy-ssc/iio-sensor-proxy-ssc.spec
          rpmbuild -ba --nodebuginfo ./iio-sensor-proxy-ssc/iio-sensor-proxy-ssc.spec
          createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: xiaomi-sheng-thp"
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/libssc-*.rpm
          dnf builddep -y ./xiaomi-sheng-thp/xiaomi-sheng-thp.spec
          rpmbuild -ba --nodebuginfo ./xiaomi-sheng-thp/xiaomi-sheng-thp.spec
          createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: xiaomi-sheng-keyboard-helper"
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/libssc-*.rpm
          dnf builddep -y ./xiaomi-sheng-keyboard-helper/xiaomi-sheng-keyboard-helper.spec
          rpmbuild -ba --nodebuginfo ./xiaomi-sheng-keyboard-helper/xiaomi-sheng-keyboard-helper.spec
          createrepo_c --update ~/rpmbuild/RPMS

      # ================================================================
      # Phase 4: Independent compiled packages
      # ================================================================
      - name: "Build: sheng-devauth"
        run: |
          dnf builddep -y ./sheng-devauth/sheng-devauth.spec
          rpmbuild -ba --nodebuginfo ./sheng-devauth/sheng-devauth.spec
          createrepo_c --update ~/rpmbuild/RPMS

      - name: "Build: xiaomi-pen-status"
        run: |
          dnf builddep -y ./xiaomi-pen-status/xiaomi-pen-status.spec
          rpmbuild -ba --nodebuginfo ./xiaomi-pen-status/xiaomi-pen-status.spec
          createrepo_c --update ~/rpmbuild/RPMS

      # ================================================================
      # Phase 5: xiaomi-sheng-fingerprint
      # ================================================================
      - name: "Build: xiaomi-sheng-fingerprint"
        run: |
          dnf builddep -y ./xiaomi-sheng-fingerprint/xiaomi-sheng-fingerprint.spec
          rpmbuild -ba --nodebuginfo ./xiaomi-sheng-fingerprint/xiaomi-sheng-fingerprint.spec
          createrepo_c --update ~/rpmbuild/RPMS

      # ================================================================
      # Phase 6: Kernel (last, heaviest, with ccache)
      # ================================================================
      - name: "Build: kernel-sm8550"
        run: |
          mkdir -p ~/.ccache
          cp kernel-sm8550/extra-sm8550.config ~/rpmbuild/SOURCES/
          dnf builddep -y ./kernel-sm8550/kernel-sm8550.spec
          rpmbuild -ba --nodebuginfo ./kernel-sm8550/kernel-sm8550.spec
          createrepo_c --update ~/rpmbuild/RPMS
          echo "=== ccache stats ==="
          ccache --show-stats

      # ================================================================
      # Upload
      # ================================================================
      - name: Upload RPMs
        uses: actions/upload-artifact@v7
        with:
          name: sheng-rpms
          path: ~/rpmbuild/RPMS/**/*.rpm
          retention-days: 14
          if-no-files-found: error

      - name: Upload SRPMs
        uses: actions/upload-artifact@v7
        with:
          name: sheng-srpms
          path: ~/rpmbuild/SRPMS/**/*.src.rpm
          retention-days: 14
          if-no-files-found: error

      # Always report the cache state: with the split restore/save the numbers
      # in this step are what tells a "cold" run apart from a regression that
      # quietly stopped caching (which is what the two spec fixes above were).
      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats --verbose 2>/dev/null || ccache --show-stats || true
          du -sh "$HOME/.ccache" 2>/dev/null || true

      # Whatever the job compiled stays cached even when a build above failed
      # (see the note on the restore step). The key is this run's, so this only
      # ever adds an entry; if it already exists the action warns and skips
      # instead of failing.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-sheng-sm8550-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

  # ==================================================================
  # GitHub Release
  # ==================================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download RPMs
        uses: actions/download-artifact@v8
        with:
          name: sheng-rpms
          path: rpms

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sheng-${{ env.SHORT_SHA }}
          name: Sheng Packages (${{ env.SHORT_SHA }})
          files: rpms/**/*.rpm
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
